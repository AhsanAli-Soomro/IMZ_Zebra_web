name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          JWT_SECRET: "habib-rice-corporation-build-secret"
          NODE_ENV: production

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Habib-Rice-Corporation-Windows-Setup
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
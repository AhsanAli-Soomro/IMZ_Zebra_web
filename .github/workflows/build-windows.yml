name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3001"

      - name: Show dist files and SHA256
        shell: bash
        run: |
          echo "Dist files:"
          ls -lah dist
          echo ""
          echo "SHA256:"
          sha256sum dist/*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habib-Rice-Corporation-Windows-Setup
          path: dist/*.exe

      - name: Delete old latest release and tag
        shell: bash
        continue-on-error: true
        run: |
          gh release delete latest-windows --yes --cleanup-tag || true
          git push origin :refs/tags/latest-windows || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Latest Windows Setup
          body: |
            Latest Windows installer for Habib Rice Corporation.

            This release is automatically generated from the latest main/master build.
          files: dist/*.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}